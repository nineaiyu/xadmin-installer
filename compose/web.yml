services:
  web:
    image: ${REGISTRY:-docker.io}/nineaiyu/xadmin-web:${VERSION}
    container_name: xadmin-web
    hostname: xadmin-web
    ulimits:
      core: 0
    restart: always
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HTTP_PORT: ${HTTP_PORT:-80}
      USE_LB: ${USE_LB:-1}
      GZIP: ${GZIP:-on}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-4096m}
    ports:
      - ${HTTP_PORT:-80}:${HTTP_PORT:-80}
    volumes:
      # web 只读消费媒体目录（.well-known root / _protected_media alias），
      # 写入方是 server 容器；nginx 自身的临时文件与日志都在镜像内/独立挂载
      - ${VOLUME_DIR}/server/data:/data/xadmin/server/data:ro
      - ${VOLUME_DIR}/nginx/data/logs:/var/log/nginx
    healthcheck:
      test: "curl -fsL http://localhost:51980/web/health/"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    # 日志上限兜底：已有 daemon.json 的机器不会补 log-opts，per-service 声明兜住
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - net