services:
  postgresql:
    image: pgvector:pg17
    container_name: xadmin-postgresql
    restart: always
    command: [ "postgres", "-c", "max_connections=8000" ]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: $DB_DATABASE
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - ${VOLUME_DIR}/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -q -U $$POSTGRES_USER"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 日志上限兜底：已有 daemon.json 的机器不会补 log-opts，per-service 声明兜住
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - net