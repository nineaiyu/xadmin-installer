name: scripts-check

# 安装器为纯 Shell 交付仓：本仓此前只有镜像同步与 release-drafter，无任何脚本门禁
# （主仓门禁矩阵见 xadmin-server / xadmin-client / xadmin-docs）。这里守住底线——
# 全部 *.sh 语法（bash -n）与入口脚本存在性，防「改坏一个脚本、用户装到一半失败」。
# 无 Docker/网络依赖，秒级完成。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bash syntax check (all *.sh)
        run: |
          set -euo pipefail
          count=0
          # -type f：deploy/web/acme.sh 是目录（内置 acme.sh 工具源），不匹配目录名
          while IFS= read -r f; do
            bash -n "$f"
            count=$((count + 1))
          done < <(find . -type f -name '*.sh' -not -path './.git/*' | sort)
          echo "checked ${count} script(s), all passed bash -n"

      - name: Entry scripts present
        run: |
          set -euo pipefail
          for f in xadmin.sh quick_start.sh scripts/7_upgrade.sh; do
            test -f "$f" || { echo "missing entry script: $f"; exit 1; }
          done
          # 一键安装必须校验同 Release 的 .md5（供应链完整性，缺失/不匹配 fail-closed）
          grep -q 'md5sum -c' quick_start.sh || { echo "quick_start.sh must verify the release .md5"; exit 1; }
          grep -q 'tar.gz.md5' quick_start.sh || { echo "quick_start.sh must download the release .md5"; exit 1; }
          echo "entry scripts present"

      # 交付脚本直接跑在客户机上：warning 级问题（未初始化变量、错误引用）也要拦。
      # 当前基线 0 warning，新增告警会直接变红。
      - name: Shellcheck (warning level)
        run: shellcheck -S warning xadmin.sh quick_start.sh scripts/*.sh .github/scripts/*.sh

      # 合并 compose 语法校验：单个 yml 依赖 network/env，必须整组渲染才能发现插值/依赖错误。
      # CONFIG_FILE 必须真实存在（compose 的 env_file/labels 会读取它）。
      - name: Compose config validation
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf 'VOLUME_DIR=%s/data\n' "$tmp" > "$tmp/config.txt"
          VERSION=dev CONFIG_FILE="$tmp/config.txt" VOLUME_DIR="$tmp/data" CONFIG_DIR="$tmp/conf" \
            docker compose --env-file config-example.txt \
            -f compose/network.yml -f compose/server.yml -f compose/celery.yml \
            -f compose/web.yml -f compose/redis.yml -f compose/postgres.yml \
            -f compose/lb.yml config -q

  # bash -n 只校验语法，抓不到 set -euo pipefail 下「引用未初始化变量」的运行期中止
  # （v5.0.0 安装器曾因此在 prepare_check_required_pkg 处直接退出）。这里用桩把几条
  # 真实调用路径跑起来，任何 unbound 中止都会让门禁变红。
  set-u-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Runtime guard (set -u unbound variables)
        run: bash .github/scripts/set-u-guard.sh

      - name: HTTPS certificate fail-closed guard
        run: bash .github/scripts/https-cert-guard.sh

      - name: Optional env switches must use the "${VAR:-default}" form
        run: |
          set -euo pipefail
          # set -u 下裸引用可选开关会直接中止安装/升级（历史事故见 AGENTS.md §十.7）
          if grep -rnE '\$SKIP_[A-Z_]+' scripts xadmin.sh quick_start.sh \
            | grep -vE '\$\{SKIP_[A-Z_]+:-'; then
            echo "bare \$SKIP_* reference found; use \${VAR:-0} instead"
            exit 1
          fi
          echo "optional switches use the safe form"

      - name: In-place alignment wiring present
        run: |
          set -euo pipefail
          # 升级链路必须保留「探询 → 预演 → 确认 → 执行」：探询用 --probe，执行才带 --apply
          grep -q 'function inplace_align_if_needed' scripts/utils.sh
          grep -q 'legacy_align --probe' scripts/utils.sh
          grep -q -- '--tag ${tag} --apply' scripts/utils.sh
          grep -q 'inplace_align_if_needed$' scripts/utils.sh
          # 无人值守开关：交互确认必须能用 INPLACE_ALIGN=1 跳过（docker exec -i 会吞掉管道输入）
          grep -q 'INPLACE_ALIGN:-0' scripts/utils.sh
          echo "in-place alignment wiring present"
