daemonize no
#bind 127.0.0.1
port 6379
timeout 300
loglevel notice
databases 16
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
rdbcompression yes
dir /data
loglevel warning
# logfile "/data/redis.log"
# slaveof <masterip> <masterport>
# masterauth <master-password>
maxclients 20480
maxmemory 2g
# Redis 同时承担缓存与 celery broker：队列消息不设 TTL，allkeys-lru 会在内存
# 触顶时无差别逐出队列消息（任务静默丢失、无告警）。volatile-lru 只逐出带过期
# 时间的缓存键/结果键，队列消息在内存压力下保住。
maxmemory-policy volatile-lru
# AOF 开启（everysec）：磁盘 IO 少量增加（每秒一次 fsync），换取队列消息在
# 容器重启后不丢——仅靠 RDB 快照时重启会丢最近一次快照之后投递的消息
# （everysec 至多丢 1 秒）。与 volatile-lru 组合的完整语义：内存触顶时队列
# 消息不被逐出，AOF 再把「保住的消息」持久化过重启——broker 消息在内存
# 压力与重启两种失效形态下都不丢。
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
# ignore-warnings ARM64-COW-BUG
