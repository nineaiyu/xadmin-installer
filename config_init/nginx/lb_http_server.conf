# 后端地址运行期解析（勿改回 upstream 静态写法）：
# - 静态 upstream 在配置加载期解析域名：lb 容器早于 web 启动时会
#   [emerg] host not found in upstream "web:8080" 启动失败（靠 restart: always 兜底）；
#   且 web 容器重建换 IP 后必须手工 restart lb 才恢复转发。
# - 变量 proxy_pass：启动不解析、建连时解析（127.0.0.11 = Docker 内嵌 DNS，
#   valid=10s 短缓存）；原 ip_hash 为多后端预设，单后端无行为差异，将来多后端
#   请改用 nginx 1.27.3+ 的 `server web:8080 resolve` + zone 保留 upstream 能力。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  set $http_server_upstream web:8080;
  # listen [::]:80;
  # server_name demo.xadmin.org;  # 取消注释并自行修改成你自己的域名

  location /.well-known/ {
    proxy_pass http://$http_server_upstream;
  }

  location / {
    return 307 https://$server_name$request_uri;
  }
}

server {
  listen 443 ssl http2;
  set $http_server_upstream web:8080;
  # listen [::]:443 ssl http2;
  # server_name demo.xadmin.org;      # 取消注释并自行修改成你自己的域名
  server_tokens off;
  ssl_certificate cert/server.crt;        # 修改 server.crt 为你的证书, 不要改路径 certs/
  ssl_certificate_key cert/server.key;    # 修改 server.key 为你的证书, 不要改路径 certs/
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;

  client_max_body_size 5000m;

  location / {
    proxy_pass http://$http_server_upstream;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;  # 如果上层还有其他 slb 需要使用 $http_x_forwarded_proto; 获取真实 proto
    # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 如果上层还有其他 slb 需要使用 $proxy_add_x_forwarded_for 获取真实 ip

    proxy_ignore_client_abort on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 6000;
  }
}
